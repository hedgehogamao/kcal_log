# Windows 云构建：GitHub 的 windows-latest 机器上编译 Release，
# 产物 zip 自动挂到对应 tag 的 GitHub Release（本机是 macOS，无法交叉编译 Windows）。
name: Build Windows

on:
  workflow_dispatch: # 手动触发（gh workflow run）
  push:
    tags: ['v*'] # 推送 v 开头的 tag 自动构建并挂到 Release

permissions:
  contents: write # 上传 Release 资产需要

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build (Release)
        run: flutter build windows --release

      - name: Package zip
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          Copy-Item -Recurse $src -Destination kcal_log
          Compress-Archive -Path kcal_log -DestinationPath kcal_log-windows.zip --Force
          Get-Item kcal_log-windows.zip | Select-Object Name, Length

      # tag 构建产物 → 挂到同名 Release（--clobber 覆盖旧资产）
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.ref_name }}" kcal_log-windows.zip
          --clobber --repo "${{ github.repository }}"

      # 手动触发（非 tag）→ 产出构建工件供下载
      - name: Upload artifact (manual run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: kcal_log-windows
          path: kcal_log-windows.zip
